name: learnloop
description: "Hanoi Travel Planner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  http: ^1.6.0
  image_picker: ^1.2.0
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/PlayfairDisplay-OFL.txt
    - assets/fonts/NunitoSans-OFL.txt
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
