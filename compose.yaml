services:
  learnloop:
    build: .
    ports:
      - "127.0.0.1:${LEARNLOOP_PORT:-8080}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://learnloop:${POSTGRES_PASSWORD:-learnloop-dev}@db:5432/learnloop
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: learnloop
      POSTGRES_USER: learnloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnloop-dev}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/migrations/002_pgvector.sql:/docker-entrypoint-initdb.d/002_pgvector.sql:ro
      - ./db/seed/001_hanoi_poi.sql:/docker-entrypoint-initdb.d/003_hanoi_poi.sql:ro
      - ./db/migrations/003_anh_quan.sql:/docker-entrypoint-initdb.d/004_anh_quan.sql:ro
      - ./db/migrations/004_auth_nguon.sql:/docker-entrypoint-initdb.d/005_auth_nguon.sql:ro
      - ./db/migrations/005_so_ngay_toi_da.sql:/docker-entrypoint-initdb.d/006_so_ngay_toi_da.sql:ro
      - ./db/seed/002_dia_diem_nguon.sql:/docker-entrypoint-initdb.d/007_dia_diem_nguon.sql:ro
      - ./data/hanoi_poi.json:/seed/hanoi_poi.json:ro
      - ./data/dia_diem_nguon.json:/seed/dia_diem_nguon.json:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U learnloop -d learnloop"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
