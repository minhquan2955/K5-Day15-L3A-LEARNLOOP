# Mô phỏng chi phí khi dùng thật — Track C (Tìm điểm & lên lộ trình Hà Nội 2–3 ngày · Nhóm LEARNLOOP)
# Chạy: python3 run.py simulate --rate-from eval/run-2.csv --wait 1

sessions: 50
seed: 42

users:
  low: 1000
  base: 5000
  high: 15000
  source: "Khách nội địa đến Hà Nội năm 2025 đạt trên 25,88 triệu lượt (~2,15 triệu lượt/tháng, Sở Du lịch Hà Nội / VietnamPlus); 3 kịch bản 1.000 / 5.000 / 15.000 người/tháng tương ứng tỷ lệ tiếp cận 0,05%–0,7% (tự ước tính)"

personas:
  - name: dung_it
    share: 0.5
    uses_per_month: 1
    turns_per_session: 1
    source: "Khách đi ngắn ngày nhập đủ thông tin nhận lịch 1 lần — khảo sát n=26 (evidence/summary.md) kết hợp (tự ước tính)"
  - name: dung_vua
    share: 0.35
    uses_per_month: 2
    turns_per_session: 2
    source: "Khách điều chỉnh lịch 1–2 lượt — khảo sát n=26 có 20/26 gặp trục trặc phải đổi lịch (evidence/summary.md) kết hợp (tự ước tính)"
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 4
    turns_per_session: 3
    source: "Nhóm chuẩn bị kỹ, thử nhiều phương án — khảo sát n=26 có 11/26 mất >=1 giờ, S14 mất >4 giờ (evidence/summary.md) kết hợp (tự ước tính)"

prices:
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 28/11/2026"
  - model: gemini-2.5-flash
    input: 0.30
    output: 2.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 28/11/2026"

usd_to_vnd:
  rate: 25500
  source: "tỷ giá tham khảo USD/VND ngày 28/11/2026 (tự ước tính làm tròn)"
